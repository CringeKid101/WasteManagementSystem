<div class="p-6 space-y-6">
  <!-- Page Title -->
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-semibold text-gray-800 font-family-heading">Waste Reports</h1>
  </div>

  <!-- Stats Cards -->
  <app-report-stats></app-report-stats>
  <!-- Filters -->
  <app-report-filters (filtersChanged)="onFilterChange($event)"></app-report-filters>
  <!-- Reports Table -->
  <app-reports-table
    [wasteReports]="reports"
    (refreshReportData)="loadReports()"
    (selectionChange)="onSelectionChange($event)"
  ></app-reports-table>

  <div class="flex justify-end mt-6">
    <span [matTooltip]="!selectedReports.length ? 'Select reports to create an event' : ''">
      <button
        mat-raised-button
        class="bg-amber-600! text-white!"
        [disabled]="!selectedReports.length"
        (click)="openCreateEventModal()"
        matTooltip=""
      >
        <mat-icon>add</mat-icon>
        Create New Event
      </button>
    </span>
  </div>
</div>

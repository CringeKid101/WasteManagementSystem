<div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">

  <div class="bg-white rounded-xl shadow p-5 border-gray-500">
    <p class="text-sm text-gray-500">Total Reports</p>
    <h2 class="text-2xl font-semibold text-gray-800 mt-2">
      {{wasteReportsStats?.totalReports}}
    </h2>
  </div>

  <div class="bg-white rounded-xl shadow p-5 border-gray-500">
    <p class="text-sm text-gray-500">Pending Reports</p>
    <h2 class="text-2xl font-semibold text-yellow-600 mt-2">
      {{wasteReportsStats?.pendingReports}}
    </h2>
  </div>

  <div class="bg-white rounded-xl shadow p-5 border-gray-500">
    <p class="text-sm text-gray-500">Approved</p>
    <h2 class="text-2xl font-semibold text-blue-600 mt-2">
      {{wasteReportsStats?.approvedReports}}
    </h2>
  </div>

  <div class="bg-white rounded-xl shadow p-5 border-gray-500">
    <p class="text-sm text-gray-500">Rejected</p>
    <h2 class="text-2xl font-semibold text-red-600 mt-2">
      {{wasteReportsStats?.rejectedReports}}
    </h2>
  </div>

</div>

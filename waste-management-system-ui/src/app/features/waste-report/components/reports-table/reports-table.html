<div class="p-6">
  <!-- Card Wrapper -->
  <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
    <!-- Header -->
    <div class="flex justify-between items-center p-4 border-b">
      <h2 class="text-lg font-semibold text-gray-800 font-family-heading">Waste Reports</h2>
    </div>

    <!-- Table -->
    <table mat-table [dataSource]="wasteReports" class="w-full">
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox (change)="toggleAll($event)" [checked]="isAllSelected()"> </mat-checkbox>
        </th>

        <td mat-cell *matCellDef="let row">
          <span [matTooltip]="row.eventId ? 'Report is already part of an event' : ''">
            <mat-checkbox
              (click)="$event.stopPropagation()"
              (change)="toggleRow(row)"
              [checked]="isSelected(row)"
              [disabled]="row.eventId !== null || row.status === 'Pending'"
              [matTooltip]="row.eventId ? 'Report is already part of an event' : ''"
            >
            </mat-checkbox>
          </span>
        </td>
      </ng-container>
      <!-- Description -->
      <ng-container matColumnDef="description">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="px-6 py-4 text-left text-gray-500 text-sm font-medium"
        >
          Description
        </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 text-gray-800 font-medium">
          {{ row.description }}
        </td>
      </ng-container>

      <!-- Location -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-gray-500 text-sm font-medium">
          Location
        </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 text-gray-600">
          {{ row.address }}
        </td>
      </ng-container>

      <ng-container matColumnDef="created">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="px-6 py-4 text-left text-gray-500 text-sm font-medium"
        >
          Created At
        </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 text-gray-800 font-medium">
          {{ row.createdAt | date: 'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-gray-500 text-sm font-medium">
          Status
        </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4">
          <span
            class="px-3 py-1 text-xs font-semibold rounded-full"
            [ngClass]="{
              'bg-yellow-100 text-yellow-700': row.status === 'Pending',
              'bg-green-100 text-green-700': row.status === 'Approved',
              'bg-red-100 text-red-700': row.status === 'Rejected',
            }"
          >
            {{ row.status }}
          </span>
        </td>
      </ng-container>

      @if (user.roles.includes('Admin')) {
        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-gray-500 text-sm font-medium">
            Actions
          </th>
          <td mat-cell *matCellDef="let row" class="px-6 py-4">
            <button
              class="bg-teal-700 hover:bg-teal-800 text-white text-sm px-4 py-2 rounded-lg transition cursor-pointer"
              (click)="openReportDialog(row.id)"
              [disabled]="row.status !== 'Pending'"
              [ngClass]="{
                'bg-gray-400! cursor-not-allowed!': row.status !== 'Pending',
              }"
            >
              View
            </button>
          </td>
        </ng-container>
      }

      <!-- Header Row -->
      <tr mat-header-row *matHeaderRowDef="columns" class="bg-gray-50 border-b"></tr>

      <!-- Data Row -->
      <tr mat-row *matRowDef="let row; columns: columns" class="hover:bg-gray-50 transition"></tr>
    </table>
  </div>
</div>

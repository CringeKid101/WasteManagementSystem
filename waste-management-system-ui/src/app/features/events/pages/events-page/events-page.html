<div class="p-6 space-y-6">

     <h1 class="text-xl font-semibold text-white-800 font-family-heading">
          Explore Events Near You
  </h1>
    <app-event-filter (filtersChanged)="onFilterChange($event)"></app-event-filter>
     <!-- Events Grid -->
     <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

          @for(event of events; track event.eventId) {
               <app-event-card [event]="event">
               </app-event-card>
          }
     </div>

</div>

<h2 mat-dialog-title class="text-2xl font-semibold text-gray-800">
  {{ event.title }}
</h2>

<mat-dialog-content class="space-y-6 max-h-[75vh] overflow-y-auto">
  <!-- Map -->
  <div class="w-full h-64 rounded-xl overflow-hidden border">
    <div id="eventMap" class="w-full h-full"></div>
  </div>

  <!-- Location -->
  <div class="flex items-center gap-2 text-gray-600">
    <span class="font-medium">📍 Location:</span>
    <span>{{ event.address }}</span>
  </div>

  <!-- Date & Time -->
  <div class="flex gap-6 text-gray-600">
    <div>
      <span class="font-medium">📅 Date:</span>
      {{ event.eventDate | date: 'mediumDate' }}
    </div>
    <div>
      <span class="font-medium">⏰ Time:</span>
      {{ event.eventDate | date: 'shortTime' }}
    </div>
  </div>

  <!-- Description -->
  <div>
    <p class="font-medium text-gray-700 mb-1">📝 Description</p>
    <p class="text-gray-600 text-sm leading-relaxed">
      {{ event.description }}
    </p>
  </div>

  <!-- Waste Images -->
  <div>
    <p class="font-medium text-gray-700 mb-2">🗑️ Waste Spots</p>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      @for(wasteImage of event.wasteImages; track wasteImage) {
        <img
          [src]="wasteImage"
          class="w-full h-32 object-cover rounded-lg border hover:scale-105 transition"
        />
      }
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="flex justify-end pt-4">
  <button mat-raised-button mat-dialog-close class="bg-gray-800! text-white!">CLOSE</button>
</mat-dialog-actions>

<mat-card class="p-4 hover:shadow-lg transition bg-white!">

     <div class="flex justify-between">
          <h3 class="font-semibold text-lg">
               {{event.title}}
          </h3>

          <button mat-icon-button (click)="openEventDetails()" matTooltip="Click for Event Details">
               <mat-icon class="text-gray-600 cursor-pointer">info</mat-icon>

          </button>
     </div>

     <p class="text-gray-500 text-xs mt-1">
          📍 {{event.address}}
     </p>

     <p class="text-gray-500 text-xs">
          🕒 {{event.eventDateObject | date:'fullDate'}}, {{event.eventDateObject | date:'shortTime'}}
     </p>

     <!-- <p class="text-sm mt-3 text-gray-600">
          Join us for a cleanup drive on MG Road!
          Let's come together to make our city cleaner and greener.
          Volunteers will be provided with gloves, bags, and refreshments.
          All are welcome to participate and make a positive impact on our environment.
     </p> -->

     <div class="flex justify-between items-center mt-4">
          <div class="flex items-center gap-2 bg-blue-100 p-3 rounded-md">
               <mat-icon class="text-blue-600">group</mat-icon>
               <span class="text-sm text-blue-600 font-semibold whitespace-nowrap">
                    {{event.totalVolunteers ?? 0}} joined
               </span>
          </div>


          <button
  (click)="handleEvent()"
  [disabled]="event.loading"
  class="px-4 py-2 rounded-lg text-white cursor-pointer"
  [ngClass]="event.isJoined ? 'bg-red-600' : 'bg-teal-800'"
>
  {{ event.isJoined ? 'Leave' : 'Join' }}
</button>

     </div>

</mat-card>

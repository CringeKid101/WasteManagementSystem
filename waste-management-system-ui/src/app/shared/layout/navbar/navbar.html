<header
  class="bg-linear-to-r from-slate-900 to-slate-700 shadow-box px-6 py-4 flex justify-between items-center"
>
  <h1 class="text-md font-semibold text-white font-family-heading">
    Hi {{ user?.givenName }}! How do you want to change the world today?
  </h1>

  <div class="flex items-center gap-3">
    @if (user.roles.includes('User') && !user.roles.includes('Organizer') && isEligible) {
      <button
        mat-raised-button
        color="primary"
        routerLink="/find-events"
        (click)="openRequestModal()"
        class="bg-amber-600! text-white!"
      >
        REQUEST ORGANIZER
      </button>
    }

    <button
      mat-raised-button
      color="primary"
      (click)="openReportModal()"
      class="bg-red-800! text-white!"
    >
      REPORT WASTE
    </button>

    <span class="text-white text-nowrap">
      {{ user?.givenName }}
    </span>

    <!-- <button mat-icon-button>
      <mat-icon>account_circle</mat-icon>
    </button> -->
    <img src="https://i.pravatar.cc/40" class="rounded-full" />
  </div>
</header>
